name: Bug report
description: Report a reproducible problem in NetHound
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please do not include credentials, tokens, private data, or sensitive domain intelligence."
  - type: input
    id: version
    attributes:
      label: NetHound version
      placeholder: "e.g. 1.0.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and sanitized output
      description: Include the command, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
